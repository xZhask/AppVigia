<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Marca «Caso índice»: el mismo dibujo que logo-vigia.svg (mismas
       posiciones y radios); solo el trazo sube de 1.7 a 2.2 por compensación
       óptica a 16 px. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7A6E"/>
      <stop offset="1" stop-color="#0A5A51"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#g)"/>
  <g transform="translate(4 4)" fill="none" stroke="#FFFFFF" stroke-width="2.2">
    <circle cx="5.2"  cy="7.5"  r="2.6"/>
    <circle cx="18.4" cy="7.2"  r="2.6"/>
    <circle cx="4.8"  cy="16.6" r="2.6"/>
    <circle cx="18.8" cy="16.8" r="2.6"/>
    <circle cx="12"   cy="12"   r="3.4" fill="#FFFFFF" stroke="none"/>
  </g>
</svg>
